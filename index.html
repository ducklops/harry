<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Harry">
<meta name="theme-color" content="#0f1f2e">

<style>
  :root { --u: min(1vw, 1.8vh); --px: 4px; --ice: #eef6d8; --lime: #c2ea6a; --ink: #070e16; --navy: #0f1f2e; }
  @media (orientation: portrait) { :root { --u: min(1.9vw, 1.1vh); } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #13293a; color: var(--ice); font-family: 'Pixelify Sans', ui-monospace, monospace; }
  body { -webkit-tap-highlight-color: transparent; }
  canvas, img.px { image-rendering: pixelated; image-rendering: crisp-edges; }

  /* ---------- 3D diorama ---------- */
  #scene { position: fixed; inset: 0; perspective: 1000px; perspective-origin: 50% 40%; overflow: hidden; pointer-events: none; }
  #world { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; pointer-events: none; }
  .layer { position: absolute; inset: -14%; pointer-events: none; }
  .layer > canvas.paint { position: absolute; left: 0; top: 0; }
  .layer > canvas.fg { z-index: 3; }
  .sp { position: absolute; left: 0; top: 0; z-index: 2; }
  .sp .cm { transform-origin: 50% 50%; }
  .sp canvas { display: block; }
  .critter { pointer-events: auto; cursor: pointer; }
  .critter:hover canvas { filter: brightness(1.15); }
  .mover { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; }
  .mover.critter { pointer-events: auto; }
  #L-rays canvas { animation: rays 5s steps(15) infinite alternate; }
  @keyframes rays { from { opacity: .55; } to { opacity: 1; } }
  .mote { position: absolute; width: var(--px); height: var(--px); background: #fff6c8; box-shadow: 0 0 calc(var(--px)*2) rgba(255,246,200,.8); animation: mote 9s steps(54) infinite alternate; }
  @keyframes mote { 0% { transform: translate(0,0); opacity: .2 } 50% { opacity: .95 } 100% { transform: translate(calc(var(--px)*14), calc(var(--px)*-22)); opacity: .3 } }
  #L-vine > canvas.paint { filter: drop-shadow(0 calc(var(--px)*7) calc(var(--px)*5) rgba(4,10,16,.5)); }

  /* ---------- content ---------- */
  #L-content { inset: 0; pointer-events: none; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: max(env(safe-area-inset-top), 28vh) calc(var(--u)*3) max(env(safe-area-inset-bottom), calc(var(--u)*3)); scrollbar-width: none; }
  @media (orientation: portrait) { #L-content { padding-top: max(env(safe-area-inset-top), 27vh); } }
  #L-content::-webkit-scrollbar { display: none; }
  @media (orientation: landscape) and (max-height: 780px) {
    #L-content { padding-top: max(env(safe-area-inset-top), 19vh); }
    h1.title { font-size: calc(var(--u) * 10.5); }
    .rule { margin: calc(var(--u)*1.4) 0 calc(var(--u)*1.3); }
    .soc-slot { margin-top: calc(var(--u)*1.8) !important; }
  }
  /* pages that hang in the jungle as little wooden signs */
  .jsign { position: absolute; z-index: 3; pointer-events: auto; text-decoration: none; transform: translateX(-50%); }
  .jsign .swing { display: flex; flex-direction: column; align-items: center; transform-origin: 50% 0; animation: jsway 3.4s steps(10) infinite alternate; animation-delay: var(--d, 0s); }
  .jsign .rope { width: var(--px); height: var(--len, 30px); background: repeating-linear-gradient(180deg, #2a2018 0 calc(var(--px)*2), #4a3a2a calc(var(--px)*2) calc(var(--px)*4)); }
  .jsign .plank { display: flex; align-items: center; gap: calc(var(--px)*2); padding: calc(var(--px)*2) calc(var(--px)*3); background: #6e4630;
    box-shadow: inset 0 calc(var(--px)*-1) 0 #46281c, inset 0 var(--px) 0 #a87452, 0 0 0 var(--px) #1e120c, 0 calc(var(--px)*2) 0 var(--px) rgba(7,14,22,.45);
    font: 600 max(11px, calc(var(--u)*1.15)) 'Pixelify Sans', monospace; letter-spacing: .14em; text-transform: uppercase; color: #f6e8c8; text-shadow: 0 1px 0 #1e120c; white-space: nowrap; }
  .jsign:hover .plank, .jsign:focus-visible .plank { background: #8e5e40; color: var(--lime); }
  .jsign:hover .swing, .jsign:focus-visible .swing { animation-duration: 1s; }
  .jsign:focus-visible { outline: none; } .jsign:focus-visible .plank { outline: 3px solid var(--lime); outline-offset: 3px; }
  @keyframes jsway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
  #L-content .ch, #L-content .tile { pointer-events: auto; }
  /* social icons float above every foliage layer: an empty slot keeps their place in the
     menu, and the dock (outside the 3D scene) is moved onto that slot every frame */
  .soc-slot { flex: none; width: 100%; margin: calc(var(--u)*3) 0 auto; pointer-events: none; }
  .soc-dock { position: fixed; left: 0; top: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; pointer-events: none; will-change: transform; transition: opacity .6s steps(4); }
  .soc-dock[hidden] { display: none; }
  .soc-dock .soc { pointer-events: auto; }
  body.reading .soc-dock { visibility: hidden; }
  .loading .soc-dock { opacity: 0; }
  .copy a { pointer-events: auto; color: inherit; text-decoration: underline; text-underline-offset: 3px; }
  .copy a:hover { color: var(--lime); }
  .copy { position: fixed; z-index: 8; left: 50%; bottom: max(8px, env(safe-area-inset-bottom)); transform: translateX(-50%); pointer-events: none; white-space: nowrap;
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: rgba(238,246,216,.78); text-shadow: 0 1px 0 #070e16, 0 0 6px rgba(7,14,22,.9); }
  /* reading view — pages open over a calmed-down jungle */
  #scene { transition: filter .5s steps(4); }
  body.reading #scene { filter: brightness(.48) saturate(.8); }
  body.reading #L-content { visibility: hidden; }
  .reader { position: fixed; inset: 0; z-index: 7; overflow-y: auto; display: none; padding: max(14px, env(safe-area-inset-top)) 16px 80px; background: rgba(7,14,22,.3); }
  body.reading .reader { display: block; animation: rin .45s steps(4); }
  @keyframes rin { from { opacity: 0; } to { opacity: 1; } }
  .reader-top { position: relative; display: flex; justify-content: center; align-items: center; max-width: 760px; margin: 4vh auto 0; }
  .reader-home { font: 400 clamp(38px, 7.5vmin, 76px)/1 'Climate Crisis', 'Arial Black', sans-serif; color: var(--ice); text-decoration: none; text-shadow: 0 .05em 0 #0b1622, 0 0 24px rgba(255,250,215,.35); }
  .reader-home:hover { color: var(--lime); }
  .reader-close { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; display: grid; place-items: center; color: var(--ice); text-decoration: none; font-size: 20px;
    background: rgba(7,14,22,.6); box-shadow: inset 0 0 0 3px rgba(238,246,216,.35); }
  .reader-close:hover, .reader-close:focus-visible { box-shadow: inset 0 0 0 3px var(--lime); color: var(--lime); outline: none; }
  .reader .sheet { --c: 4px; max-width: 760px; margin: 4vh auto 0; padding: clamp(22px, 4vw, 44px); background: rgba(9,18,28,.9); box-shadow: inset 0 0 0 3px rgba(238,246,216,.18);
    font: 400 18px/1.7 Barlow, system-ui, sans-serif; color: var(--ice);
    clip-path: polygon(0 var(--c), var(--c) var(--c), var(--c) 0, calc(100% - var(--c)) 0, calc(100% - var(--c)) var(--c), 100% var(--c), 100% calc(100% - var(--c)), calc(100% - var(--c)) calc(100% - var(--c)), calc(100% - var(--c)) 100%, var(--c) 100%, var(--c) calc(100% - var(--c)), 0 calc(100% - var(--c))); }
  .reader .sheet h1 { margin: 0 0 .5em; font: 600 clamp(24px, 4vw, 34px)/1.2 'Pixelify Sans', ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--lime); }
  .reader .sheet h2, .reader .sheet h3 { font-family: 'Pixelify Sans', ui-monospace, monospace; letter-spacing: .08em; color: var(--lime); }
  .reader .sheet a { color: var(--lime); }
  .reader .sheet img, .reader .sheet video, .reader .sheet iframe { max-width: 100%; }
  .reader .sheet blockquote { margin: 1em 0; padding-left: 1em; border-left: 4px solid var(--lime); font: italic 22px/1.4 'Cormorant Garamond', Georgia, serif; }
  .reader .sheet table { width: 100%; border-collapse: collapse; font-size: 16px; }
  .reader .sheet th, .reader .sheet td { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(238,246,216,.18); vertical-align: top; }
  .reader .sheet th { font: 600 13px 'Pixelify Sans', monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--lime); }
  .reader .sheet .btn-consent { display: inline-block; margin-top: 6px; padding: 10px 14px; font: 600 13px 'Pixelify Sans', monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); background: var(--lime); text-decoration: none; }
  .reader .sheet td code { white-space: nowrap; }

  /* blocks made by the console's page editor */
  .reader .sheet::after { content: ''; display: block; clear: both; }
  .reader .sheet .pe-c { text-align: center; }
  .reader .sheet figure.pe-img { margin: 1.2em auto; }
  .reader .sheet figure.pe-img img { display: block; width: 100%; height: auto; }
  .reader .sheet .pe-img.pe-full { width: 100%; }
  .reader .sheet .pe-img.pe-medium { width: 66%; }
  .reader .sheet .pe-img.pe-small { width: 40%; }
  .reader .sheet .pe-img.pe-auto { width: fit-content; max-width: 100%; }
  .reader .sheet .pe-img.pe-auto img { width: auto; max-width: 100%; }
  .reader .sheet .pe-img.pe-left { float: left; margin: .35em 1.4em .8em 0; }
  .reader .sheet .pe-img.pe-right { float: right; margin: .35em 0 .8em 1.4em; }
  .reader .sheet .pe-img figcaption { margin-top: .5em; font-size: 14px; line-height: 1.5; color: rgba(238,246,216,.7); text-align: center; }
  .reader .sheet .pe-gallery { display: grid; grid-template-columns: repeat(var(--cols, 3), 1fr); gap: 10px; margin: 1.4em 0; clear: both; }
  .reader .sheet .pe-gallery.pe-cols-2 { --cols: 2; }
  .reader .sheet .pe-gallery.pe-cols-4 { --cols: 4; }
  .reader .sheet .pe-gallery img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
  .reader .sheet .pe-embed { margin: 1.4em 0; clear: both; }
  .reader .sheet .pe-embed iframe { display: block; width: 100%; border: 0; }
  .reader .sheet .pe-embed.pe-video iframe { height: auto; aspect-ratio: 16 / 9; }
  .reader .sheet .pe-embed.pe-tall { max-width: 340px; margin-left: auto; margin-right: auto; }
  .reader .sheet .pe-embed.pe-tall iframe { height: auto; aspect-ratio: 9 / 16; }
  .reader .sheet .pe-btnrow { margin: 1.4em 0; }
  .reader .sheet .pe-btn { display: inline-block; padding: 12px 18px; font: 600 14px/1.2 'Pixelify Sans', ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); background: var(--lime); text-decoration: none; }
  .reader .sheet .pe-btn:hover { filter: brightness(1.1); }
  .reader .sheet hr { height: 4px; margin: 2em 0; border: 0; clear: both; background: repeating-linear-gradient(90deg, rgba(238,246,216,.28) 0 8px, transparent 8px 16px); }
  @media (max-width: 600px) { .reader .sheet .pe-img.pe-left, .reader .sheet .pe-img.pe-right { float: none; margin: 1.2em auto; } .reader .sheet .pe-img.pe-medium, .reader .sheet .pe-img.pe-small { width: 80%; } .reader .sheet .pe-gallery.pe-cols-3, .reader .sheet .pe-gallery.pe-cols-4 { --cols: 2; } }
  .reader .loadingtxt { font-family: 'Pixelify Sans', monospace; letter-spacing: .2em; text-transform: uppercase; color: rgba(238,246,216,.7); }
  .hero { display: flex; flex-direction: column; align-items: center; margin-top: auto; }
  h1.title { margin: 0; font-family: 'Climate Crisis', 'Arial Black', system-ui, sans-serif; font-weight: 400; font-size: calc(var(--u) * 12.5); line-height: .9; letter-spacing: .01em;
    color: var(--ice); white-space: nowrap; user-select: none;
    text-shadow: 0 .045em 0 #0b1622, 0 .09em 0 rgba(11,22,34,.55), 0 0 calc(var(--u)*3) rgba(255,250,215,.45); }
  @media (orientation: portrait) { h1.title { font-size: calc(var(--u) * 10.5); } }
  .ch { display: inline-block; font-variation-settings: "YEAR" var(--yr, 1979); cursor: default; }
  .tagline { margin: calc(var(--u)*1.4) 0 0; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: max(16px, calc(var(--u)*2)); color: rgba(238,246,216,.92); text-shadow: 0 2px 0 rgba(7,14,22,.6); text-align: center; max-width: 60ch; }
  .rule { display: flex; align-items: center; gap: calc(var(--px)*3); margin: calc(var(--u)*2.2) 0 calc(var(--u)*2); }
  .rule i { display: block; width: calc(var(--u)*10); height: var(--px); background: linear-gradient(90deg, transparent, rgba(238,246,216,.75)); }
  .rule i:last-child { transform: scaleX(-1); }
  .rule img { display: block; }

  .menu { display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u)*1.6) calc(var(--u)*2.2); max-width: min(96vw, calc(var(--u)*100)); }
  .tile { --c: var(--px); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*.9); text-decoration: none; color: var(--ice); outline: none; width: calc(var(--u)*10); }
  .tile .frame { position: relative; width: calc(var(--u)*7.6); aspect-ratio: 1; display: grid; place-items: center; background: rgba(7,14,22,.5); box-shadow: inset 0 0 0 var(--px) rgba(238,246,216,.28);
    clip-path: polygon(0 var(--c), var(--c) var(--c), var(--c) 0, calc(100% - var(--c)) 0, calc(100% - var(--c)) var(--c), 100% var(--c), 100% calc(100% - var(--c)), calc(100% - var(--c)) calc(100% - var(--c)), calc(100% - var(--c)) 100%, var(--c) 100%, var(--c) calc(100% - var(--c)), 0 calc(100% - var(--c))); }
  .tile .ji.up { width: 72%; height: 72%; object-fit: contain; }
  .tile .name { font-weight: 600; font-size: max(12px, calc(var(--u)*1.3)); letter-spacing: .16em; text-transform: uppercase; text-shadow: 0 2px 0 rgba(7,14,22,.85); white-space: nowrap; }
  .tile .name::before { content: '▸'; display: inline-block; width: 0; overflow: hidden; vertical-align: top; color: var(--lime); }
  .tile:hover .frame, .tile:focus-visible .frame { background: rgba(28,96,52,.6); box-shadow: inset 0 0 0 var(--px) var(--lime); transform: translateY(calc(var(--px)*-2)); }
  .tile:hover .name, .tile:focus-visible .name { color: var(--lime); }
  .tile:hover .name::before, .tile:focus-visible .name::before { width: 1em; }
  .socials { display: flex; gap: calc(var(--u)*1); margin: 0; flex-wrap: wrap; justify-content: center; }
  .soc { --c: var(--px); position: relative; display: grid; place-items: center; width: max(44px, calc(var(--u)*4.4)); aspect-ratio: 1; background: rgba(7,14,22,.72); box-shadow: inset 0 0 0 var(--px) rgba(238,246,216,.55);
    clip-path: polygon(0 var(--c), var(--c) var(--c), var(--c) 0, calc(100% - var(--c)) 0, calc(100% - var(--c)) var(--c), 100% var(--c), 100% calc(100% - var(--c)), calc(100% - var(--c)) calc(100% - var(--c)), calc(100% - var(--c)) 100%, var(--c) 100%, var(--c) calc(100% - var(--c)), 0 calc(100% - var(--c))); outline: none; }
  .soc .ji.up { width: 62%; height: 62%; object-fit: contain; }
  .soc:hover, .soc:focus-visible { background: rgba(28,96,52,.7); box-shadow: inset 0 0 0 var(--px) var(--lime); }
  .soc-label { min-height: 1.6em; margin: calc(var(--u)*.8) 0 0; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: rgba(238,246,216,.85); text-shadow: 0 2px 0 rgba(7,14,22,.8); }

  /* ---------- HUD + captions ---------- */
  .hud { position: fixed; z-index: 10; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); }
  .hud button { width: 44px; height: 44px; border: 0; background: rgba(7,14,22,.6); box-shadow: inset 0 0 0 3px rgba(238,246,216,.4); color: var(--ice); cursor: pointer; display: grid; place-items: center; }
  .hud button[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--lime); }
  .hud img { width: 28px; }
  .guide { position: fixed; z-index: 9; pointer-events: none; transform: translate(-50%, -100%); background: rgba(7,14,22,.86); box-shadow: inset 0 0 0 3px rgba(194,234,106,.75); padding: 8px 12px 7px; text-align: center; white-space: nowrap; animation: guide 2.6s steps(13) forwards; }
  .guide b { display: block; font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--lime); }
  .guide i { display: block; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 16px; color: var(--ice); }
  @keyframes guide { 0% { opacity: 0; margin-top: 8px; } 10% { opacity: 1; margin-top: 0; } 85% { opacity: 1; } 100% { opacity: 0; } }
  .wx { position: fixed; z-index: 10; top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); display: flex; align-items: center; gap: 12px; padding: 7px 12px 7px 9px; background: rgba(7,14,22,.6); box-shadow: inset 0 0 0 3px rgba(238,246,216,.28); }
  .wx img { width: 30px; }
  .wx div { display: flex; flex-direction: column; line-height: 1.05; }
  .wx b { font-weight: 600; font-size: 17px; letter-spacing: .06em; color: var(--ice); }

  @media (max-width: 420px) { .wx { gap: 9px; padding: 6px 9px 6px 7px; } .wx img { width: 24px; } .wx b { font-size: 15px; } }
  .flash { position: fixed; inset: 0; z-index: 8; pointer-events: none; background: #e8f0f4; opacity: 0; mix-blend-mode: screen; }
  .flash.on { animation: flash .7s steps(1) forwards; }
  @keyframes flash { 0% { opacity: .55 } 12% { opacity: 0 } 24% { opacity: .35 } 36% { opacity: .05 } 48%, 100% { opacity: 0 } }
  .mote.firefly { background: #e6ff7a; box-shadow: 0 0 calc(var(--px)*3) calc(var(--px)*1) rgba(214,255,90,.85); }
  .draft { position: fixed; z-index: 10; left: 50%; top: 10px; transform: translateX(-50%); background: #f6d24a; color: #2a1a00; padding: 6px 14px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
  .noscript { position: fixed; inset: auto 0 0 0; background: var(--ink); color: var(--ice); padding: 12px; text-align: center; }
  #L-content { transition: opacity .6s steps(4); }
  .loading #L-content { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { #L-rays canvas, .mote { animation: none !important; } }
</style>
</head>
<body class="loading">
<div id="scene">
  <div id="world">
    <div class="layer" id="L-sky"   data-z="-1500"></div>
    <div class="layer" id="L-far"   data-z="-1000"></div>
    <div class="layer" id="L-back"  data-z="-600"></div>
    <div class="layer" id="L-mid"   data-z="-260"></div>
    <div class="layer" id="L-wxback" data-z="-340"></div>
    <div class="layer" id="L-rays"  data-z="-120"></div>
    <main class="layer" id="L-content" data-z="0">
      <header class="hero">
        <h1 class="title" id="title" aria-label="Harry"></h1>
        <p class="tagline" id="tagline" hidden></p>
      </header>
      <div class="rule" aria-hidden="true"><i></i><img id="ruleLeaf" class="px" alt=""><i></i></div>
      <nav class="menu" id="menu" aria-label="Pages"></nav>
      <div class="soc-slot" id="socSlot" aria-hidden="true"></div>
    </main>
    <div class="layer" id="L-near"  data-z="170"></div>
    <div class="layer" id="L-front" data-z="330"></div>
    <div class="layer" id="L-wxfront" data-z="250"></div>
    <div class="layer" id="L-vine"  data-z="440"></div>
  </div>
</div>
<div class="soc-dock" id="socDock">
  <nav class="socials" id="socials" aria-label="Social media"></nav>
  <div class="soc-label" id="socLabel" aria-hidden="true"></div>
</div>
<div class="flash" id="flash" aria-hidden="true"></div>
<div class="reader" id="reader" role="dialog" aria-modal="true" aria-label="Page">
  <div class="reader-top"><a class="reader-home" id="readerHome" href="./">Harry</a><a class="reader-close" id="readerClose" href="./" aria-label="Back to the jungle">✕</a></div>
  <article class="sheet" id="readerBody"></article>
</div>
<div class="copy" id="copy">Copyright © <span id="yr">2026</span> Ducklops · <a href="./cookies">Cookies</a></div>
<div class="hud"><button id="soundBtn" aria-pressed="false" aria-label="Jungle sounds" title="Jungle sounds"><img id="soundIcon" class="px" alt=""></button></div>
<noscript><div class="noscript">This jungle needs JavaScript switched on.</div></noscript>

<script src="jungle-kit.js"></script>
<script>
(function () {
  'use strict';
  const K = JungleKit, M = K.Motion, T = K.TONES;
  const $ = (s) => document.querySelector(s);
  const layers = {};
  document.querySelectorAll('.layer').forEach((l) => { layers[l.id.slice(2).toLowerCase()] = l; });
  const PERSP = 1000;
  Object.values(layers).forEach((l) => { const z = +l.dataset.z; l.style.transform = `translateZ(${z}px) scale(${(PERSP - z) / PERSP})`; });

  /* ---------- geometry: viewport % → layer pixels ---------- */
  let TREE = [];
  let PX = 4, Wv = 0, Hv = 0, LW = 0, LH = 0, UNIT = 10, PORTRAIT = false;
  const X = (vx) => (vx + 14) / 128 * LW, Y = (vy) => (vy + 14) / 128 * LH, U = (n) => n * UNIT / PX;
  const pick = (v) => (Array.isArray(v) ? (PORTRAIT ? v[1] : v[0]) : v);

  function paintCanvas(layer, cls = 'paint') {
    const cv = document.createElement('canvas');

  /* ---------- parallax: follows the cursor; settles flat a second after it leaves ---------- */
  const tgt = { x: 0, y: 0 }, cur = { x: 0, y: 0 };
  let leaveTimer = null;
  const settle = () => { clearTimeout(leaveTimer); leaveTimer = setTimeout(() => { tgt.x = 0; tgt.y = 0; }, 1000); };
  addEventListener('pointermove', (e) => {
    if (e.pointerType === 'mouse') { clearTimeout(leaveTimer); if (!reading) { tgt.x = e.clientX / innerWidth - 0.5; tgt.y = e.clientY / innerHeight - 0.5; } }
  }, { passive: true });
  document.documentElement.addEventListener('mouseleave', settle);
  addEventListener('mouseout', (e) => { if (!e.relatedTarget) settle(); });
  addEventListener('blur', settle);
  addEventListener('deviceorientation', (e) => { if (e.gamma == null || reading) return; tgt.x = Math.max(-0.5, Math.min(0.5, e.gamma / 60)); tgt.y = Math.max(-0.5, Math.min(0.5, (e.beta - 45) / 60)); });

    const amp = M.reduce ? 0 : PORTRAIT ? 0.55 : 1, dt = Math.min(0.1, ((now || performance.now()) - lastFrame) / 1000); lastFrame = now || performance.now();

    cur.x += (tgt.x - cur.x) * k; cur.y += (tgt.y - cur.y) * k;

      $('#reader').scrollTop = 0; $('#readerClose').focus({ preventScroll: true });
    } catch (e) {
      if (seq !== readSeq) return;
      body.innerHTML = `<h1>Lost in the jungle</h1><p>This page couldn't be found.</p><p><a href="${ROOT.href}">Back to the jungle</a></p>`;
      document.title = 'Not found · ' + (SITE.title || 'Harry');
    }
  }
  function closeReader(push) {
    readSeq++; if (push) history.pushState({}, '', ROOT.href);
    if (!reading) return; reading = false; document.body.classList.remove('reading'); document.title = SITE.title || 'Harry';
    if (AC && soundOn) MASTER.gain.setTargetAtTime(0.9, AC.currentTime, 0.6);
  }
  document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a[href]');
    if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || (a.target && a.target !== '_self') || a.hasAttribute('download')) return;
    if (a.hasAttribute('data-consent-open') || (a.getAttribute('href') || '').startsWith('#')) return;
    const u = new URL(a.href);
    if (u.origin === location.origin && (u.pathname === ROOT.pathname || u.pathname === ROOT.pathname + 'index.html') && !u.search) { e.preventDefault(); if (reading || location.href !== ROOT.href) closeReader(true); return; }
    const info = pageInfo(u); if (info) { e.preventDefault(); openPage(info, true); }
  });
  addEventListener('popstate', () => { const info = pageInfo(new URL(location.href)); info ? openPage(info, false) : closeReader(false); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && reading) closeReader(true); });
  /** first load: ?p=about (from a page's own redirect) or /index.html → clean address */
  function routeOnLoad() {
    const p = QS.get('p'), keep = new URLSearchParams(location.search); keep.delete('p');
    const extra = keep.toString() ? '?' + keep : '';
    const info = p ? pageInfo(new URL(p, ROOT)) : pageInfo(new URL(location.href));
    if (info) { history.replaceState({ page: info.key }, '', info.pretty + extra); openPage(info, false); }
    else if (/index\.html$/i.test(location.pathname) || p) history.replaceState({}, '', ROOT.href + extra);
  }
  document.addEventListener('click', (e) => { if (e.target.closest && e.target.closest('[data-consent-open]')) { e.preventDefault(); K.Consent.banner(ROOT.href + 'cookies', true); } });
  document.getElementById('yr').textContent = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', year: 'numeric' }).format(new Date());

  /* ---------- build ---------- */
  function measure() {
    Wv = innerWidth; Hv = innerHeight; PORTRAIT = Hv > Wv;
    PX = Math.max(2, Math.min(6, Math.round(Math.min(Wv, Hv) / 210)));
    document.documentElement.style.setProperty('--px', PX + 'px');
    UNIT = PORTRAIT ? Math.min(Wv * 0.019, Hv * 0.011) : Math.min(Wv * 0.01, Hv * 0.018);
    LW = Wv * 1.28 / PX; LH = Hv * 1.28 / PX;
  }
  function build() {
    measure(); M.clear(); TREE = [];
    renderContent();
    paintSky(); paintFar(); paintBack(); paintMid(); paintRays(); paintNear(); paintFront(); paintVine(); if (ENV.phase !== 'night' && !/storm|heavy/.test(ENV.wx.kind)) birds(); setupWeather();
    M.onFrame(drawWaterfall);
    M.onFrame(() => document.querySelectorAll('#title .ch').forEach((ch) => {
      if (ch._yr === ch._tgt) return;
      const step = ch._tgt > ch._yr ? 7 : -4;
      ch._yr = step > 0 ? Math.min(ch._tgt, ch._yr + step) : Math.max(ch._tgt, ch._yr + step);
      ch.style.setProperty('--yr', ch._yr);
    }));
    M.tick();
  }

  let lastW = innerWidth, lastH = innerHeight, rt;
  addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => { if ((innerHeight > innerWidth) !== PORTRAIT || Math.abs(innerWidth - lastW) > 100 || Math.abs(innerHeight - lastH) > 140) { lastW = innerWidth; lastH = innerHeight; build(); } }, 250);
  });

  loadSite().then((site) => {
    SITE = Object.assign({}, K.DEFAULT_SITE, site || {});
    const go = () => {
      ENV.phase = computePhase(); K.setGrade(gradeFor());
      measure(); renderContent(); document.body.classList.remove('loading'); updateHUD(); routeOnLoad(); K.Consent.banner(ROOT.href + 'cookies');
      setTimeout(() => { build(); M.start(); requestAnimationFrame(frame); fetchWeather(); }, 30);   // paint the jungle behind the menu
    };
    (document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 600))]) : Promise.resolve()).then(go);
  });
})();
</script>
