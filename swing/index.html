<script>
(function () {
  'use strict';
  const K = JungleKit, T = K.TONES, AR = Arcade;
  const QS = new URLSearchParams(location.search);

  /* ---------- monkeys ---------- */
  const SKINS = [
    { id: 'spider', name: 'Spider monkey', price: 0, kind: 'monkey', note: 'The original swinger.' },
    { id: 'capuchin', name: 'Capuchin', price: 60, kind: 'capuchin', note: 'Small, smart and quick off the mark.' },
    { id: 'howler', name: 'Howler', price: 150, c: { fur: '#3a2418', dark: '#1e120c', face: '#2a1a12', belly: '#6a3a22' }, note: 'The loudest monkey in the jungle.' },
    { id: 'orangutan', name: 'Orangutan', price: 300, kind: 'orangutan', note: 'Long arms, big heart.' },
    { id: 'tamarin', name: 'Golden tamarin', price: 600, c: { fur: '#f08a1c', dark: '#c8601a', face: '#5a3a2a', belly: '#f6aa3e' }, note: 'A blaze of orange through the trees.' },
    { id: 'snow', name: 'Snow monkey', price: 1000, c: { fur: '#b4b8bc', dark: '#7a7e82', face: '#e88a8a', belly: '#dcdee0' }, note: 'Visiting from the mountains.' },
    { id: 'midnight', name: 'Midnight', price: 1600, c: { fur: '#1e3a6a', dark: '#0f1f3e', face: '#82d0e8', belly: '#2e5aa0' }, note: 'Comes out after dusk.' },
    { id: 'king', name: 'Banana king', price: 3000, c: { fur: '#f2d22a', dark: '#b88a12', face: '#fff09a', belly: '#fff6c8' }, note: 'All hail.' }
  ];
  SKINS.forEach((s) => { if (s.c) { s.kind = 'vs_' + s.id; K.A[s.kind] = () => K.A.monkey(s.c); } });

  /* ---------- pixel bits ---------- */
  const BANANA = AR.pix([
    '......kk',
    '......Y.',
    '.....yY.',
    '....yyY.',
    '..yyyyY.',
    'yyyyyY..',
    '.ooo....'
  ], { k: '#4a2a14', y: '#f2c62a', Y: '#fff09a', o: '#b88a12' });
  const BUNCH = (() => { const k = AR.mk(12, 10); k.c.drawImage(BANANA, 0, 3); k.c.drawImage(BANANA, 3, 1); k.c.drawImage(BANANA, 4, 3); return k.cv; })();
  const WASP = [0, 1].map((f) => AR.pix(f ? [
    '.ww..',
    'wwww.',
    'kykyk',
    '.kyk.'
  ] : [
    '.....',
    'w.ww.',
    'kykyk',
    '.kyk.'
  ], { w: '#e8f4f8', k: '#14181a', y: '#f2c62a' }));

  /* ---------- the frame: menu, missions, shop ---------- */
  const A = AR.init({
    key: 'harry-swing', name: 'Vine Swing', slug: 'swing', unit: 'm', unitLong: 'metres',
    how: '<b>Hold</b> to grab the nearest vine, <b>let go</b> to fling. Swing over the crocodile river, grab bananas and keep your flow going. Time passes as you travel, from dawn to night.',
    hint: 'Hold to grab · let go to fling',
    cur: { one: 'banana', many: 'Bananas', icon: BANANA },
    skins: SKINS, skinsLabel: 'Monkeys', shopLabel: 'Monkeys & upgrades',
    upgrades: [
      { id: 'reach', name: 'Long arms', desc: (l) => `Grab vines from further away. Reach ${95 + l * 8} → ${95 + (l + 1) * 8}`, costs: [30, 80, 180, 400, 800] },
      { id: 'magnet', name: 'Banana nose', desc: 'Sniffs out bananas and pulls nearby ones in.', costs: [40, 100, 240, 500, 1000] },
      { id: 'pads', name: 'Lily luck', desc: 'More lily pads on the river to bounce you back up.', costs: [30, 90, 200, 450] },
      { id: 'flow', name: 'Steady flow', desc: 'Your flow multiplier drains more slowly.', costs: [60, 150, 350] },
      { id: 'taxi', name: 'Toucan taxi', desc: 'A toucan catches you before the river, once per run per level.', costs: [150, 600] }
    ],
    missions: [
      { id: 'dist', stat: 'dist', text: (n) => `Swing ${AR.fmt(n)} m in one run`, targets: [100, 250, 400, 600, 900, 1300, 1800, 2500] },
      { id: 'cur', stat: 'cur', text: (n) => `Grab ${AR.fmt(n)} bananas in one run`, targets: [15, 35, 60, 100, 150, 220, 300] },
      { id: 'vines', stat: 'vines', text: (n) => `Grab ${n} vines in one run`, targets: [15, 30, 50, 80, 120, 170] },
      { id: 'flow', stat: 'flow', text: (n) => `Reach ×${n} flow`, targets: (t) => Math.min(5, 2 + t), when: (D) => (D.mt.flow || 0) < 4 },
      { id: 'flowtime', stat: 'flow5', text: (n) => `Stay at ×5 flow for ${n} seconds`, targets: [3, 6, 10, 15, 20, 30], when: (D) => (D.mt.flow || 0) >= 4 },
      { id: 'skip', stat: 'skip', text: (n) => `Fling past ${n} vine${n > 1 ? 's' : ''} without grabbing`, targets: [1, 3, 6, 10, 15, 22] },
      { id: 'flips', stat: 'flips', text: (n) => `Do ${n} flip${n > 1 ? 's' : ''} in one run`, targets: [1, 3, 6, 10, 15] },
      { id: 'pads', stat: 'pads', text: (n) => `Bounce on ${n} lily pad${n > 1 ? 's' : ''} in one run`, targets: [1, 2, 3, 5, 7], when: (D) => D.best >= 80 },
      { id: 'rot', stat: 'rot', total: true, text: (n) => `Swing from ${n} rotten vines (all runs)`, targets: [3, 10, 25, 50, 90], when: (D) => D.best >= 300 },
      { id: 'wasp', stat: 'waspdist', text: (n) => `Swing ${AR.fmt(n)} m past the wasps`, targets: [100, 250, 500, 800], when: (D) => D.best >= 1000 },
      { id: 'total', stat: 'dist', total: true, text: (n) => `Swing ${AR.fmt(n)} m across all runs`, targets: [1000, 3000, 7000, 15000, 30000, 60000] }
    ],
    reward: 20,
    cardTitle: ['VINE', 'SWING'], cardLabel: 'Furthest swing', cardPose: { parts: { '.p-arm': 'rotate(-150deg)' } },
    shareText: (best, url) => `I swung ${AR.fmt(best)} m in Vine Swing. Can you go further? Play at ${url}`,
    start: () => startRun(),
    quit: () => { if (state === 'play') die('You let go of the run.', true); },
    onSkin: () => makeMonkey(),
    onEnv: () => { layerCache.clear(); rain = []; setPhase(phaseName(), true); },
    regrade: () => K.setGrade(AR.gradeFor(curPhase, A.wx))
  });

  /* ---------- canvas & pixel scale ---------- */
  const cv = document.getElementById('game'), ctx = cv.getContext('2d');
  let W = 300, H = 240, S = 3, WATER = 224, TW = 300;
  function resize() {
    S = Math.max(1, Math.min(innerHeight / 240, innerWidth / 205));   // phones in portrait get a closer view
    W = Math.min(560, Math.ceil(innerWidth / S)); H = Math.min(400, Math.ceil(innerHeight / S));
    cv.width = W; cv.height = H; cv.style.width = W * S + 'px'; cv.style.height = H * S + 'px';
    ctx.imageSmoothingEnabled = false;
    WATER = H - 16; TW = Math.max(W, 300);
    layerCache.clear(); setPhase(curPhase, true);
  }

  /* ---------- scenery, painted once per time of day ---------- */
  const layerCache = new Map();
  const START_PHASE = AR.PHASES.indexOf(A.phase) < 0 ? 1 : AR.PHASES.indexOf(A.phase);
  let curPhase = AR.PHASES[START_PHASE], L = null, prevL = null, fadeT = 1;
  function wrap(w, fn) { [-w, 0, w].forEach((o) => fn(o)); }
  function paintPhase(ph) {
    const key = ph + W + 'x' + H; if (layerCache.has(key)) return layerCache.get(key);
    K.setGrade(AR.gradeFor(ph, A.wx));
    const out = {};
    let k = AR.mk(W, H), P = new K.Painter(k.c, 4);
    P.vgrad(0, 0, W, H, AR.skyStops(ph, A.wx));
    if (ph !== 'night') P.rgrad(W * 0.72, H * 0.12, H * 0.7, [[0, 'rgba(255,251,230,.85)'], [1, 'rgba(255,251,230,0)']]);
    else { const R = K.rng(5); for (let i = 0; i < W * H / 160; i++) { k.c.fillStyle = R() > 0.6 ? '#e8f0f4' : '#96a8c4'; k.c.fillRect(Math.floor(R() * W), Math.floor(R() * H * 0.6), 1, 1); } P.circ(W * 0.78, H * 0.18, 6, '#e8f0f4'); }
    for (let i = 0; i < 5; i++) P.cloud(W * (0.1 + i * 0.2), H * (0.2 + P.r() * 0.18), 10 + P.r() * 12);
    K.finalize(k.c, W, H, { dither: 30, grade: ph === 'night' ? 0.4 : 0.8 }); out.sky = k.cv;
    // far canopy hills
    k = AR.mk(TW, H); P = new K.Painter(k.c, 6);
    for (let i = 0; i < 26; i++) { const x = P.r() * TW, y = H * (0.6 + P.r() * 0.2), r = 10 + P.r() * 14; wrap(TW, (o) => P.clump(x + o, y, r, T.leafTeal, [0, -1])); }
    k.c.fillStyle = '#2e606a'; k.c.fillRect(0, H * 0.74, TW, H);
    K.finalize(k.c, TW, H, { haze: 0.45, hazeColor: '#c6e4ec', dither: 18 }); out.far = k.cv;
    // mid: trunks, a few lianas and bank greenery
    k = AR.mk(TW, H); P = new K.Painter(k.c, 8);
    for (let i = 0; i < 4; i++) { const x = (i + P.r() * 0.6) * TW / 4, w = 6 + P.r() * 5; wrap(TW, (o) => P.trunk(x + o, -4, H, w * 0.7, w, T.barkCool, { moss: false })); }
    for (let i = 0; i < 24; i++) { const x = P.r() * TW, y = H * (0.8 + P.r() * 0.1), r = 7 + P.r() * 9; wrap(TW, (o) => P.clump(x + o, y, r, T.leafA, [0, -1])); }
    K.finalize(k.c, TW, H, { haze: 0.4, hazeColor: '#a6c8c4', dither: 14 }); out.mid = k.cv;
    // canopy band along the top (the vines hang from this)
    k = AR.mk(TW, 34); P = new K.Painter(k.c, 12);
    for (let i = 0; i < 40; i++) { const x = P.r() * TW, y = 2 + P.r() * 10, r = 6 + P.r() * 7; wrap(TW, (o) => P.clump(x + o, y, r, i % 3 ? T.leafA : T.leafB, [0, 1])); }
    for (let i = 0; i < 18; i++) { const x = P.r() * TW; wrap(TW, (o) => P.line(x + o, 10, x + o + (P.r() - 0.5) * 3, 16 + P.r() * 14, 1, T.leafMid[2])); }
    K.finalize(k.c, TW, 34, { dither: 12 }); out.top = k.cv;
    // river (tiles)
    const RW = 96; k = AR.mk(RW, 22); P = new K.Painter(k.c, 14);
    const night = ph === 'night';
    k.c.fillStyle = night ? '#0f1f2e' : '#1e4152'; k.c.fillRect(0, 2, RW, 20);
    k.c.fillStyle = night ? '#183446' : '#2e606a'; k.c.fillRect(0, 2, RW, 3);
    k.c.fillStyle = night ? '#4c8a88' : '#82bcae'; k.c.fillRect(0, 2, RW, 1);
    for (let i = 0; i < 18; i++) { k.c.fillStyle = P.r() > 0.5 ? (night ? '#25505e' : '#4c8a88') : (night ? '#183446' : '#25505e'); k.c.fillRect(Math.floor(P.r() * RW), 6 + Math.floor(P.r() * 14), 3 + Math.floor(P.r() * 6), 1); }
    K.finalize(k.c, RW, 22, { dither: 8 }); out.water = k.cv;
    // knot of leaves where each vine can be grabbed (3 kinds), rotten knot
    out.knot = [0, 1, 2].map((v) => { const c = AR.mk(18, 14), p = new K.Painter(c.c, 30 + v); for (let i = 0; i < 3; i++) p.clump(5 + i * 4 + p.r() * 2, 7 + p.r() * 2, 3 + p.r() * 2, i % 2 ? T.leafB : T.leafMid, [0, -1]); K.finalize(c.c, 18, 14, { dither: 10 }); return c.cv; });
    out.rot = (() => { const c = AR.mk(18, 14), p = new K.Painter(c.c, 40); for (let i = 0; i < 3; i++) p.clump(5 + i * 4, 7 + p.r() * 2, 3 + p.r() * 2, T.cliff, [0, -1]); K.finalize(c.c, 18, 14, { dither: 10 }); return c.cv; })();
    const g = AR.gradeFor(ph, A.wx);
    out.col = { vine: ['#070e16', '#237438', '#4cae3a', '#82d044'].map((h) => AR.gradeHex(h, g)), rotv: ['#070e16', '#5e3826', '#8e5e40', '#a87452'].map((h) => AR.gradeHex(h, g)),
      pad: ['#0e2a22', '#2c883a', '#82d044', '#e0a8f0'].map((h) => AR.gradeHex(h, g)), lime: '#c2ea6a', text: '#eef6d8' };
    out.phase = ph;
    layerCache.set(key, out);
    return out;
  }
  function setPhase(ph, now) {
    if (L && ph === curPhase && !now) return;
    prevL = now ? null : L; fadeT = now ? 1 : 0; curPhase = ph;
    L = paintPhase(ph);
    K.setGrade(AR.gradeFor(ph, A.wx));
    makeMonkey();
  }
  const PHASE_M = 400;   // metres per time of day
  const phaseName = () => AR.PHASES[(START_PHASE + Math.floor(Math.max(0, dist) / PHASE_M)) % 5];

  /* ---------- the monkey ---------- */
  const MW = 16;
  let frames = {}, mH = 22;
  function makeMonkey() {
    const kind = A.skin().kind;
    const f = (parts) => { const s = new K.Sprite(kind, MW, { pad: 1 }); s.render({ parts }); return s.canvas; };
    frames = {
      hang: [f({ '.p-tail': 'rotate(10deg)' }), f({ '.p-tail': 'rotate(-12deg)' })],
      air: [f({ '.p-arm': 'rotate(-140deg)', '.p-tail': 'rotate(20deg)' }), f({ '.p-arm': 'rotate(-165deg)', '.p-tail': 'rotate(-6deg)' })]
    };
    mH = frames.hang[0].height - 2;
  }
  const HAND = { x: 0.44, y: 0.025 };   // where the raised hand is on the drawing

  /* ---------- game state ---------- */
  const G = 480, PUMP = 95, VMAX = 300;
  let state = 'menu', p = { x: 0, y: 0 }, v = { x: 0, y: 0 }, ang = 0, spin = 0, spinLeft = 0, rope = null, ropeL = 0;
  let anchors = [], bananas = [], pads = [], wasps = [], fx = [], snapped = [];
  let camX = 0, X0 = 0, dist = 0, flow = 0, flow5 = 0, bananasRun = 0, held = false, autoHold = true, lastIdx = 0, nextIdx = 0, genX = 0;
  let taxis = 0, rescue = null, croc = null, releasedAt = -9, lastRel = null, time = 0, rain = [], deadAt = 0;
  const reach = () => 95 + A.lvl('reach') * 8;
  const rnd = Math.random;

  function addAnchor(x, y, type) {
    const a = { x0: x, x, y, type, idx: nextIdx++, len: 10 + rnd() * 14, tip: { x, y: y + 18 }, tv: { x: 0, y: 0 }, ph: rnd() * 6.28, hold: 0, broken: false, v: Math.floor(rnd() * 3), topX: x + (rnd() - 0.5) * 16 };
    anchors.push(a); return a;
  }
  function generate() {
    while (genX < camX + W + 220) {
      const d = (genX - X0) / 10, band = Math.max(40, H * 0.36 - 22);
      let gap = d < 40 ? 56 + rnd() * 14 : (52 + Math.min(30, d / 40)) + rnd() * (26 + Math.min(20, d / 60));
      const big = d > 150 && rnd() < Math.min(0.18, d / 3000);
      if (big) gap *= 1.45;
      const x = genX + gap, y = d < 40 ? 34 + rnd() * 18 : 22 + rnd() * band;
      let type = 'vine';
      if (d > 300 && rnd() < Math.min(0.22, (d - 300) / 2500)) type = 'rot';
      else if (d > 600 && rnd() < Math.min(0.3, (d - 600) / 2000)) type = 'sway';
      const prev = anchors[anchors.length - 1], a = addAnchor(x, y, type);
      // bananas along the swing between the two vines
      if (prev && rnd() < 0.7) {
        const n = 3 + Math.floor(rnd() * 3), base = (prev.y + a.y) / 2 + 40 + rnd() * 20;
        for (let i = 0; i < n; i++) { const t = 0.25 + (i / Math.max(1, n - 1)) * 0.6; bananas.push({ x: prev.x + (a.x - prev.x) * t, y: base - Math.sin(Math.PI * t) * (22 + rnd() * 10), big: false, got: false, bob: rnd() * 6 }); }
      }
      if (prev && rnd() < 0.12 + Math.min(0.1, d / 4000)) bananas.push({ x: (prev.x + a.x) / 2, y: Math.min(prev.y, a.y) - 8 - rnd() * 10, big: true, got: false, bob: rnd() * 6 });
      // lily pads to bounce on
      const padChance = Math.max(0.06, 0.34 - d / 3000) + A.lvl('pads') * 0.05 + (big ? 0.4 : 0);
      if (prev && d > 8 && rnd() < padChance) pads.push({ x: prev.x + (a.x - prev.x) * (0.3 + rnd() * 0.4), w: 18 + Math.floor(rnd() * 6), used: false, sink: 0, flower: rnd() < 0.4 });
      // wasps from 1 km
      if (prev && d > 1000 && rnd() < Math.min(0.2, (d - 1000) / 4000)) wasps.push({ x: (prev.x + a.x) / 2, y0: (prev.y + a.y) / 2 + 45, amp: 18 + rnd() * 18, ph: rnd() * 6.28, sp: 1.6 + rnd() * 1.2, cool: 0 });
      genX = x;
    }
    const cut = camX - 160;
    anchors = anchors.filter((a) => a.x > cut || a === rope);
    bananas = bananas.filter((b) => b.x > cut && !(b.got && b.t > 0.5));
    pads = pads.filter((q) => q.x > cut);
    wasps = wasps.filter((w) => w.x > cut);
  }

  function startRun() {
    A.audio(); A.begin(); state = 'play';
    anchors = []; bananas = []; pads = []; wasps = []; fx = []; snapped = []; rescue = null; croc = null; FL.clear();
    nextIdx = 0; X0 = 60 - (QS.has('debug') ? +QS.get('from') || 0 : 0) * 10; dist = 0; flow = 0; flow5 = 0; bananasRun = 0; time = 0; taxis = A.lvl('taxi');
    const first = addAnchor(60, 40, 'vine'); genX = 60; camX = 60 - W * 0.3;
    rope = first; ropeL = 52; lastIdx = 0; held = false; autoHold = true; spin = 0; spinLeft = 0;
    p = { x: first.x - Math.sin(0.7) * ropeL, y: first.y + Math.cos(0.7) * ropeL }; v = { x: 0, y: 0 };
    setPhase(phaseName(), true); generate(); hud();
    A.score('0<small>m</small>');
  }

  /* ---------- helpers ---------- */
  function body() { return { x: p.x - Math.sin(ang) * mH * 0.55, y: p.y + Math.cos(ang) * mH * 0.55 }; }
  const FL = AR.Floats(cv);
  function float(x, y, txt, col) { FL.add(x, y, txt, col); }
  function burst(x, y, col, n, sp = 60) { for (let i = 0; i < n; i++) { const a = rnd() * 6.28, s = sp * (0.4 + rnd()); fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, t: 0, life: 0.5 + rnd() * 0.4, col }); } }
  const mult = () => 1 + Math.floor(flow);
  function hud() {
    A.hud(`<span class="b">${A.CI}${AR.fmt(bananasRun)}</span><span class="f">Flow ×${mult()}</span>${taxis ? `<span>Taxi ×${taxis}</span>` : ''}`);
  }
  function target() {
    let best = null, bs = -1e9; const R = reach();
    for (const a of anchors) {
      if (a.broken || (a === lastRel && time - releasedAt < 0.18)) continue;
      const dx = a.x - p.x, dy = a.y - p.y, d = Math.hypot(dx, dy);
      if (d > R || dy > 6 || dx < -24) continue;
      const s = dx - d * 0.15; if (s > bs) { bs = s; best = a; }
    }
    return best;
  }
  function grab(a) {
